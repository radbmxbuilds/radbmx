<!--
  RAD BMX Builds — canonical header snippet.
  ============================================================================
  HOW TO USE
    Copy the <header>...</header> block below verbatim into each HTML page
    immediately inside <body>. There is no build step resolving partials —
    this file is the single source of truth so the pages don't drift.

  The site is a single content page (index.html) plus a 404, so the header
  is just the brand mark linking home — no nav. If pages are added later,
  reintroduce a <nav> here and copy it into every page.
  ============================================================================
-->
<header class="site-header">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-header__inner">
    <a class="site-brand" href="index.html" aria-label="RAD BMX Builds home">
      <img class="site-brand__mark" src="logos/image0.png" alt="RAD BMX Builds" width="48" height="48">
    </a>
  </div>
</header>
